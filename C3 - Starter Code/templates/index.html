{% extends "base.html" %}
{% block content %}
    <h1 class="p-8 text-4xl">Book tracker</h1>
    <div class="px-12">
        {% if books %}
            <h2 class="text-2xl">Your books:</h2>
        {% endif %}
        <div class="flex justify-center">
            <div
                class="flex flex-col justify-center items-center gap-12 bg-blue-300 mt-12 px-24 py-8 rounded-lg w-2/3"
            >
                {% for book in books %}
                    <div
                        class="flex justify-between items-center gap-8 py-2 border-gray-600 border-b w-full"
                    >
                        <p class="px-12 text-lg text-center">{{ book.name }}</p>
                        <p class="px-12 text-lg text-center">{{ book.genres }}</p>
                    </div>
                {% empty %}
                    <p>No books found.</p>
                {% endfor %}
            </div>
        </div>
    </div>
{% endblock content %}
