{% comment %} Modals {% endcomment %}
{% comment %} Confirmation modal {% endcomment %}
{% partialdef delete_confirm %}
    <div
        x-data="confirmModal"
        x-cloak
        x-show="open"
        x-transition.opacity
        @keydown.escape.window="close()"
        class="z-50 fixed inset-0 flex justify-center items-center bg-black/50 p-4"
        role="dialog"
        aria-modal="true"
        aria-labelledby="confirm-modal-title"
    >
        <div
            @click.outside="close()"
            class="bg-white shadow-xl p-6 rounded-lg w-full max-w-md"
        >
            <h2 id="confirm-modal-title" class="font-semibold text-xl">Confirm action</h2>
            <p class="mt-4 text-gray-700" x-text="question"></p>
            <div class="flex justify-end gap-3 mt-6">
                <button
                    type="button"
                    @click="close()"
                    class="px-4 py-2 border border-gray-400 rounded-lg cursor-pointer"
                >Cancel</button>
                <button
                    type="button"
                    @click="confirm()"
                    class="bg-red-600 px-4 py-2 rounded-lg text-white cursor-pointer"
                >Confirm</button>
            </div>
        </div>
    </div>
{% endpartialdef delete_confirm %}
